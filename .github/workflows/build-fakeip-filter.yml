name: Build fakeip-filter mrs

on:
  push:
    branches:
      - main
    paths:
      - "fakeip-filter.list"
      - ".github/workflows/build-fakeip-filter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          VERSION=1.19.20
          curl -fL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-amd64-compatible-v${VERSION}.gz"
          ls -lh mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Convert fakeip-filter.list to fakeip-filter.mrs
        run: |
          ./mihomo convert-ruleset domain text fakeip-filter.list fakeip-filter.mrs
          ls -lh fakeip-filter.mrs

      - name: Commit generated mrs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fakeip-filter.mrs
          git commit -m "build fakeip-filter.mrs" || echo "No changes to commit"
          git push
